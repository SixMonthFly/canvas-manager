name: Publish website

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build site
        run: node website/scripts/build-pages.mjs --out _pages --repository "${{ github.repository }}"
      # Downloads are enabled only after the matching Release asset is verified.
      - name: Resolve published downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          SITE_DIR: _pages/site
        run: python3 website/scripts/prepare-release.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
